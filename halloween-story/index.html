<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kivel találkozunk? — IG story</title>
<style>
  /* fonts are bundled locally (SIL OFL) so the canvas renders identically offline */
  @font-face { font-family:"Merriweather"; font-weight:700; src:url(fonts/Merriweather-Bold.ttf) format("truetype"); }
  @font-face { font-family:"Merriweather"; font-weight:900; src:url(fonts/Merriweather-Black.ttf) format("truetype"); }
  @font-face { font-family:"Space Mono"; font-weight:400; src:url(fonts/SpaceMono-Regular.ttf) format("truetype"); }
  @font-face { font-family:"Space Mono"; font-weight:700; src:url(fonts/SpaceMono-Bold.ttf) format("truetype"); }
  :root { --bg:#0b0606; --panel:#140c0c; --line:#2a1a1a; --ink:#e9e2e2; --dim:#8c7c7c; --red:#a2000d; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Space Mono", ui-monospace, monospace; }
  .wrap { display:flex; gap:24px; padding:16px; min-height:100vh; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  .stage { position:relative; height:calc(100vh - 32px); aspect-ratio:9/16; max-width:100%; }
  .stage canvas { width:100%; height:100%; display:block; background:#000; }
  .safe { position:absolute; inset:0; pointer-events:none; display:none; }
  .safe.on { display:block; }
  .safe .top, .safe .bot { position:absolute; left:0; right:0; background:repeating-linear-gradient(45deg, rgba(0,200,255,.18) 0 8px, rgba(0,200,255,.06) 8px 16px); border:1px dashed rgba(0,200,255,.7); color:#7fdcff; font-size:11px; padding:4px 6px; }
  .safe .top { top:0; height:calc(250/1920*100%); }
  .safe .bot { bottom:0; height:calc(340/1920*100%); display:flex; align-items:flex-end; }
  .panel { width:300px; max-width:100%; background:var(--panel); border:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:14px; }
  .panel h1 { font:900 20px/1.1 Merriweather, serif; margin:0; color:var(--red); }
  .tabs { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  button, .tabs button { background:#1d1212; color:var(--ink); border:1px solid var(--line); padding:8px 6px; font:inherit; cursor:pointer; }
  button:hover { border-color:#5a2a2a; }
  .tabs button.on { background:var(--red); border-color:var(--red); color:#fff; }
  label { display:flex; flex-direction:column; gap:4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  input[type=text] { background:#0c0707; color:var(--ink); border:1px solid var(--line); padding:8px; font:inherit; }
  .row { display:flex; gap:8px; align-items:center; color:var(--dim); font-size:12px; }
  .note { color:var(--dim); font-size:11px; }
  .vname { color:var(--ink); font-size:12px; min-height:3em; }
  @media (max-width:720px){ .stage { height:auto; width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="story" width="1080" height="1920"></canvas>
    <div class="safe" id="safe"><div class="top">IG safe zone · top 250px</div><div class="bot">IG safe zone · bottom 340px</div></div>
  </div>
  <div class="panel">
    <h1>Kivel találkozunk?</h1>
    <div class="tabs" id="tabs">
      <button data-v="a">A · Selyem</button>
      <button data-v="b">B · Strobe</button>
      <button data-v="c">C · Hold</button>
      <button data-v="d">D · Minimal</button>
    </div>
    <div class="vname" id="vname"></div>
    <label>Dátum <input type="text" id="date" value="2026. OKT. XX. · 22:00"></label>
    <label>Helyszín <input type="text" id="loc" value="HELYSZÍN HAMAROSAN"></label>
    <div class="row"><input type="checkbox" id="anim" checked> <span>Animáció (6 mp loop)</span></div>
    <div class="row"><input type="checkbox" id="safeT"> <span>IG safe zone megjelenítése</span></div>
    <div class="row"><input type="checkbox" id="guides" checked> <span>Dátum/helyszín jelölő keret</span></div>
    <button id="png">PNG letöltése (1080×1920)</button>
    <button id="rec">6 mp WebM felvétele</button>
    <div class="note">The date/location fields update the poster live. Export is the exact canvas at 1080×1920. The safe-zone overlay never appears in the export.</div>
  </div>
</div>

<script>
(() => {
const W = 1080, H = 1920, LOOP = 6; // seconds
const RED = '#a2000d';
const qs = new URLSearchParams(location.search);
const state = {
  v: qs.get('v') || 'd',
  date: qs.get('date') || null,
  loc: qs.get('loc') || null,
  anim: qs.get('static') ? false : true,
  guides: qs.get('guides') !== '0',
};

/* ---------------- WebGL: liquid chrome + fog + moon ---------------- */
const BG_SCALE = +(qs.get('bgscale') || 0.5); // shader res; grain hides upscale
const gcv = document.createElement('canvas');
gcv.width = Math.round(W * BG_SCALE); gcv.height = Math.round(H * BG_SCALE);
const gl = gcv.getContext('webgl', { preserveDrawingBuffer:true, premultipliedAlpha:true, alpha:true });

const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uPhase; uniform int uMode; uniform int uVar;
uniform vec3 uMoon; uniform float uMoonA; uniform float uGlow; uniform float uChrome;
// --- Ashima 3D simplex noise ---
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.42; } return s; }
vec2 orb(float r, float off){ float a=6.2831853*uPhase+off; return r*vec2(cos(a),sin(a)); }
// silk field: anisotropic (horizontal ribbons) domain-warped noise, seamless in time
float silk(vec2 p){
  vec2 t1=orb(.22,0.), t2=orb(.16,2.3);
  vec2 q=vec2(fbm(vec3(p+t1,1.7)), fbm(vec3(p+vec2(5.2,1.3)-t1,3.1)));
  float h = fbm(vec3(p+1.6*q+t2, 2.0));
  return .5*h + .035*sin(h*14.+p.y*3.+q.x*4.);   // contour ribbons → long liquid folds
}
void main(){
  vec2 P = gl_FragCoord.xy/uRes*vec2(1080.,1920.); P.y = 1920.-P.y;  // story px, y down
  vec2 uv = P/1920.;                                                   // 0..0.5625 x 0..1
  float y = uv.y;
  if(uMode==1){
    // ---------- fog layer (premultiplied rgba) ----------
    vec2 fp = uv*vec2(2.2,6.)+vec2(uPhase*0.,0.);
    vec2 d1 = orb(.5,1.), d2 = orb(.35,4.);
    float f = fbm(vec3(fp+d1, 7.)) *.6 + fbm(vec3(fp*2.1+d2, 11.))*.4;
    float band;
    if(uVar==0) band = smoothstep(.55,1.,y)*1.0 + smoothstep(.25,.0,abs(y-.33))*.25;
    else if(uVar==1) band = smoothstep(.6,1.,y)*.8 + smoothstep(.12,.0,abs(y-.5))*.35;
    else if(uVar==2) band = smoothstep(.5,.95,y)*1.0 + smoothstep(.09,.0,abs(y-.43))*.9;
    else band = smoothstep(.68,1.,y)*.9;
    float d = clamp(smoothstep(-.1,.6,f)*band,0.,1.)*.42;
    vec3 c = mix(vec3(.5,.48,.49), vec3(.6,.1,.06), smoothstep(.6,1.,y)*.6);
    gl_FragColor = vec4(c*d, d);
    return;
  }
  // ---------- liquid chrome ----------
  vec2 p = vec2(uv.x*1.25 + uv.y*.45, uv.y*3.4 - uv.x*1.1); // diagonal, stretched ribbons
  float e = 1./uRes.y*3.4;
  float h  = silk(p);
  float hx = silk(p+vec2(e,0.));
  float hy = silk(p+vec2(0.,e));
  vec3 n = normalize(vec3((h-hx)/e*.075, (h-hy)/e*.075, 1.));
  // reflection lookup into a striped "studio" environment → liquid chrome bands
  float a  = dot(n.xy, normalize(vec2(-.62,.78)));
  float a2 = dot(n.xy, normalize(vec2(.9,.35)));
  float slope = length(n.xy);
  float region = smoothstep(.15,.6, fbm(vec3(uv*vec2(1.6,1.1)+orb(.08,1.),20.)) + .3 - y*.9);
  vec3 col = vec3(.008,.004,.005) + vec3(.1,.09,.095)*smoothstep(-.2,.5,a);          // satin body
  float silver = smoothstep(.22,.34,a)*(1.-smoothstep(.55,.85,a));
  col += vec3(.93,.92,.93)*silver*(.28+region*1.1);
  col += vec3(1.,.02,.05)*exp(-pow((a+.32)/.045,2.))*1.15;                              // red neon edges
  col += vec3(.45,.0,.03)*exp(-pow((a+.25)/.12,2.))*.22;
  col += vec3(.25,.8,.85)*exp(-pow((a2-.42)/.05,2.))*.3*smoothstep(.2,.5,slope);         // teal kicker
  col = mix(col, vec3(.95,.94,.95)*(.55+.6*smoothstep(-.2,.5,a)), region*smoothstep(-.1,.35,a)*.6); // silver pour
  col *= uChrome;
  // --- variant masks (negative space) ---
  float mask = 1.;
  if(uVar==0) mask = mix(1., .45, smoothstep(.55,.95,y));
  if(uVar==1){
    float band = exp(-pow((y-.47)/.11,2.));               // one horizontal tear of chrome
    float edge = exp(-pow((y-.47)/.03,2.));
    mask = band*.95 + .05;
    col += vec3(.9,.9,.92)*edge*silver*1.2;
  }
  // moon
  vec2 mc = uMoon.xy/1920.; float mr = uMoon.z/1920.;
  vec2 dv = uv-mc; float md = length(dv);
  float disk = smoothstep(mr, mr-.002, md);
  if(uVar==2){
    mask = .12 + disk*1.0;
  }
  if(uVar==3) mask = .05 + .55*smoothstep(.8,1.05,y);   // minimal: black, silk only as a floor
  col *= mask;
  if(uMoonA>0.){
    float crat = fbm(vec3(dv*14., 40.))*.5+.5;
    vec3 moonc = mix(vec3(.55,.5,.48), vec3(.85,.82,.78), crat);
    float limb = smoothstep(mr, mr*.2, md);
    if(uVar==2){
      // the moon is made of the silk itself, with a pale limb and a red underside
      col = mix(col, col*1.25 + vec3(.06,.05,.05)*crat, disk);
      col += disk*vec3(.5,.02,.02)*smoothstep(-.2,1.,dv.y/mr)*.35;
      col += vec3(.6,.6,.62)*smoothstep(mr*.92,mr,md)*disk*.5;
    } else {
      // thin crescent: lit disk minus an offset shadow disk
      float shadow = smoothstep(mr*.97, mr*.97-.002, length(uv-(mc+vec2(-.32,.12)*mr)));
      float lit = disk*(1.-shadow);
      col = mix(col, col*.25, disk*.85*uMoonA);                 // the dark side still occludes the silk
      col += moonc*lit*uMoonA*1.1;
    }
    float halo = exp(-max(md-mr,0.)/(mr*.55));
    col += vec3(.8,.18,.12)*halo*(1.-disk)*.10*uMoonA;
  }
  // low red/orange ground glow
  vec3 gc = mix(vec3(.65,.03,.02), vec3(.9,.28,.05), .35);
  col += gc * pow(smoothstep(.6,1.1,y),2.6) * uGlow;
  gl_FragColor = vec4(col,1.);
}`;
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog,n);
const u = { res:U('uRes'), phase:U('uPhase'), mode:U('uMode'), v:U('uVar'), moon:U('uMoon'), moonA:U('uMoonA'), glow:U('uGlow'), chrome:U('uChrome') };
function glPass(mode, vi, phase, p){
  gl.viewport(0,0,gcv.width,gcv.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(u.res, gcv.width, gcv.height);
  gl.uniform1f(u.phase, phase); gl.uniform1i(u.mode, mode); gl.uniform1i(u.v, vi);
  gl.uniform3f(u.moon, p.moon[0], p.moon[1], p.moon[2]); gl.uniform1f(u.moonA, p.moonA);
  gl.uniform1f(u.glow, p.glow); gl.uniform1f(u.chrome, p.chrome);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  return gcv;
}

/* ---------------- 2D helpers ---------------- */
const cv = document.getElementById('story'); const ctx = cv.getContext('2d');
const mk = (w=W,h=H) => { const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const layer = mk(); const lx = layer.getContext('2d');

// seeded RNG so the PNG export is reproducible
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const grainTiles = [0,1,2,3].map(k => {
  const c = mk(512,512), g = c.getContext('2d'), im = g.createImageData(512,512), r = rng(1234+k);
  for(let i=0;i<im.data.length;i+=4){ const v = (r()+r()+r())/3*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  g.putImageData(im,0,0); return c;
});
function grain(g, frame, amt){
  const r = rng(frame*7+3), tile = grainTiles[frame%4];
  const pat = g.createPattern(tile,'repeat');
  pat.setTransform(new DOMMatrix().translate(Math.floor(r()*512), Math.floor(r()*512)));
  g.save(); g.globalCompositeOperation='overlay'; g.globalAlpha=amt; g.fillStyle=pat; g.fillRect(0,0,W,H); g.restore();
}
function vignette(g, k){
  const rg = g.createRadialGradient(W/2,H*.48,H*.25, W/2,H*.5,H*.75);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,`rgba(0,0,0,${k})`);
  g.fillStyle=rg; g.fillRect(0,0,W,H);
}
function lightLeak(g, x, y, r, color, a){
  if(a<=0) return;
  const rg = g.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,color.replace('A',a)); rg.addColorStop(.45,color.replace('A',a*.35)); rg.addColorStop(1,color.replace('A',0));
  g.save(); g.globalCompositeOperation='screen'; g.fillStyle=rg; g.fillRect(0,0,W,H); g.restore();
}
// faint spiderweb: spokes from an anchor with sagging threads between them
function web(g, cx, cy, R, a0, a1, spokes, rings, alpha, seed){
  const r = rng(seed);
  const angs = []; for(let i=0;i<spokes;i++) angs.push(a0+(a1-a0)*(i/(spokes-1)) + (r()-.5)*.06);
  g.save(); g.strokeStyle=`rgba(225,220,220,${alpha})`; g.lineWidth=1.2; g.lineCap='round';
  angs.forEach(a => { g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); g.stroke(); });
  for(let k=1;k<=rings;k++){
    const rr = R*Math.pow(k/rings,1.15)*(.96+r()*.04);
    g.beginPath();
    for(let i=0;i<angs.length-1;i++){
      const aA=angs[i], aB=angs[i+1], am=(aA+aB)/2;
      const ax=cx+Math.cos(aA)*rr, ay=cy+Math.sin(aA)*rr, bx=cx+Math.cos(aB)*rr, by=cy+Math.sin(aB)*rr;
      const sag = rr*.82; // pull control point toward the anchor → sagging silk
      if(i===0) g.moveTo(ax,ay);
      g.quadraticCurveTo(cx+Math.cos(am)*sag, cy+Math.sin(am)*sag, bx, by);
    }
    g.lineWidth = .8+ (k/rings)*.8; g.stroke();
  }
  g.restore();
}
function fitSize(g, font, lines, maxW, start){
  let s = start; g.font = font(s);
  while(Math.max(...lines.map(l=>g.measureText(l).width)) > maxW && s>10){ s -= 1; g.font = font(s); }
  return s;
}
const SERIF = s => `900 ${s}px Merriweather`;
const SERIF7 = s => `700 ${s}px Merriweather`;
const MONO = (s,w=400) => `${w} ${s}px "Space Mono"`;

// Date / location slot: corner-bracket frame + mono labels; editable from the panel
function infoSlot(g, x, y, w, opts){
  const date = state.date ?? document.getElementById('date').value;
  const loc  = state.loc  ?? document.getElementById('loc').value;
  const center = opts.align === 'center', h = center ? 200 : 150;
  g.save();
  if(state.guides){
    g.strokeStyle='rgba(235,230,230,.55)'; g.lineWidth=2; const c=22;
    const br=(px,py,dx,dy)=>{ g.beginPath(); g.moveTo(px+dx*c,py); g.lineTo(px,py); g.lineTo(px,py+dy*c); g.stroke(); };
    br(x,y,1,1); br(x+w,y,-1,1); br(x,y+h,1,-1); br(x+w,y+h,-1,-1);
  }
  g.textBaseline='alphabetic';
  const label = (t,px,py)=>{ g.fillStyle = opts.label || '#d0222c'; g.font = MONO(19,700); g.fillText(t,px,py); };
  const value = (t,px,py,maxW)=>{ g.fillStyle='#f2eeee'; g.font = SERIF7(fitSize(g, SERIF7, [t], maxW, 36)); g.fillText(t,px,py); };
  if(center){
    const cx = x+w/2; g.textAlign='center';
    label('DÁTUM', cx, y+44);  value(date, cx, y+88,  w-70);
    label('HELYSZÍN', cx, y+130); value(loc, cx, y+174, w-70);
  } else {
    g.textAlign='left';
    label('DÁTUM', x+34, y+60);    value(date, x+200, y+62,  w-240);
    label('HELYSZÍN', x+34, y+112); value(loc, x+200, y+114, w-240);
  }
  g.restore();
}

// Reserved space for the Instagram poll sticker: a small CTA above, faint brackets around
function pollSlot(g, x, y, w, h, a){
  if(a <= 0) return;
  g.save(); g.globalAlpha = a;
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillStyle='#f2eeee'; g.font = MONO(24,700);
  g.fillText('SZAVAZZ', x+w/2, y-44);
  // hand-drawn arrow (the mono font has no ↓ glyph)
  const ax = x+w/2, ay = y-30;
  g.strokeStyle='#f2eeee'; g.lineWidth=2.5; g.beginPath();
  g.moveTo(ax, ay); g.lineTo(ax, ay+20); g.moveTo(ax-7, ay+13); g.lineTo(ax, ay+20); g.lineTo(ax+7, ay+13); g.stroke();
  if(state.guides){
    g.strokeStyle='rgba(235,230,230,.35)'; g.lineWidth=2; const c=26;
    const br=(px,py,dx,dy)=>{ g.beginPath(); g.moveTo(px+dx*c,py); g.lineTo(px,py); g.lineTo(px,py+dy*c); g.stroke(); };
    br(x,y,1,1); br(x+w,y,-1,1); br(x,y+h,1,-1); br(x+w,y+h,-1,-1);
    g.fillStyle='rgba(235,230,230,.28)'; g.font = MONO(18);
    g.fillText('SZAVAZÁS MATRICA HELYE', x+w/2, y+h/2+6);
  }
  g.restore();
}

/* ---------------- Variants ---------------- */
const tri = (t,c,w) => Math.max(0, 1-Math.abs(((t-c+1.5)%1)-.5)/w); // periodic pulse at c, width w
const VARIANTS = {
  d: {
    name:'D · MINIMÁL — mostly black, kinetic stretched crimson type (letters stagger in, breathe, glitch on a strobe hit, then lift out), a reserved space for the IG poll sticker, and silk only as a floor.',
    still: .45,
    draw(t, frame){
      const T = t*LOOP;
      const hit = Math.max(tri(t,.52,.008), .6*tri(t,.545,.006));        // strobe hit ≈ 3.1 s
      const p = { moon:[0,0,0], moonA:0, glow:.35+.15*Math.sin(t*6.283), chrome:.8+hit*.6 };
      ctx.drawImage(glPass(0,3,t,p),0,0,W,H);
      ctx.save(); ctx.globalAlpha=.8; ctx.drawImage(glPass(1,3,t,p),0,0,W,H); ctx.restore();
      // ---- kinetic headline: per-glyph transforms ----
      lx.clearRect(0,0,W,H);
      const lines = ['KIVEL','TALÁLKOZUNK?'], SY = 1.9;
      const s = fitSize(lx, SERIF, lines, 900, 200);
      lx.font = SERIF(s); lx.textAlign='left'; lx.textBaseline='alphabetic';
      const bases = [520, 520 + s*SY*1.12];
      const easeOutExpo = x => x>=1 ? 1 : 1-Math.pow(2,-10*x);
      const easeInCubic = x => x*x*x;
      const clamp01 = x => Math.max(0, Math.min(1, x));
      const hash = k => { const r = rng(k*97+5); return r(); };
      let k = 0;
      const ghosts = [];
      lines.forEach((line, li) => {
        const total = lx.measureText(line).width, x0 = (W-total)/2;
        for(let i=0;i<line.length;i++,k++){
          const ch = line[i];
          const xa = lx.measureText(line.slice(0,i)).width, wa = lx.measureText(line.slice(0,i+1)).width - xa;
          const ein = easeOutExpo(clamp01((T - (0.12 + k*0.028)) / 0.75));   // stagger 28 ms → 476 ms budget
          const eout = easeInCubic(clamp01((T - (4.85 + k*0.02)) / 0.45));   // exits faster than entrances
          const live = ein*(1-eout);
          if(live <= 0.001) continue;
          let dy = (1-ein)*70 - eout*90 + Math.sin(6.283*(T/3) + k*.5)*6*live;   // breathe (period 3 s → loops)
          let sy = SY*(1 + (1-ein)*1.4 + eout*1.8), dx = 0, sx = 1;
          if(hit > .05 && hash(k) < .4){ dx = (hash(k+31)-.5)*70*hit; sx = 1 + hit*.5; }
          const blur = (1-ein)*16 + eout*12;
          const cx = x0 + xa + wa/2, by = bases[li] + dy;
          lx.save();
          lx.filter = blur > .5 ? `blur(${blur.toFixed(1)}px)` : 'none';
          lx.globalAlpha = live;
          lx.translate(cx + dx, by); lx.scale(sx, sy);
          lx.fillStyle = RED; lx.fillText(ch, -wa/2, 0);
          lx.restore();
          // secondary layer: ghost trail during motion
          const motion = (1-ein) + eout + hit;
          if(motion > .02) ghosts.push({ch, cx: cx - dx*.6, by: by + (1-ein)*60, sy: sy*1.15, a: Math.min(1,motion)*.45*Math.max(live,.3), wa});
        }
      });
      roughen(lx, frame, .5);
      // ghosts behind the type
      ctx.save(); ctx.filter='blur(10px)'; ctx.globalCompositeOperation='screen'; ctx.font = SERIF(s); ctx.textAlign='left';
      ghosts.forEach(g => { ctx.save(); ctx.globalAlpha=g.a; ctx.fillStyle='#ff1a2a'; ctx.translate(g.cx, g.by); ctx.scale(1, g.sy); ctx.fillText(g.ch, -g.wa/2, 0); ctx.restore(); });
      ctx.restore();
      ctx.save(); ctx.shadowColor='rgba(162,0,13,.45)'; ctx.shadowBlur=30; ctx.drawImage(layer,0,0); ctx.restore();
      // ---- poll sticker space ----
      const pollIn = easeOutExpo(clamp01((T-.9)/.6)) * (1 - easeInCubic(clamp01((T-5.0)/.4)));
      pollSlot(ctx, 190, 990, 700, 290, pollIn);
      infoSlot(ctx, 140, 1360, 800, { align:'center' });
      if(hit > 0){
        ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle=`rgba(255,245,240,${hit*.1})`; ctx.fillRect(0,0,W,H); ctx.restore();
      }
      lightLeak(ctx, W+60, 1700, 700, 'rgba(255,50,20,A)', .12+.06*Math.sin(t*6.283));
      vignette(ctx,.6);
      grain(ctx, frame, .22);
    }
  },

  a: {
    name:'A · VÖRÖS SELYEM — the reference, almost one to one: liquid chrome-silk, large grainy crimson stacked type, fog pouring in low, a faint moon and spiderweb.',
    draw(t, frame){
      const pulse = .5+.5*Math.sin(t*Math.PI*2);
      const flick = 1 - .5*tri(t,.37,.012) - .35*tri(t,.395,.008) - .4*tri(t,.81,.01);
      const p = { moon:[900,455,120], moonA:.8, glow:.55+.35*pulse, chrome:1 };
      ctx.drawImage(glPass(0,0,t,p),0,0,W,H);
      web(ctx, W+10, 1585, 520, Math.PI*1.03, Math.PI*1.47, 7, 7, .10, 7);
      // headline
      lx.clearRect(0,0,W,H);
      const lines=['KIVEL','TALÁL-','KOZUNK?'];
      const s = fitSize(lx, SERIF, lines, 940, 260);
      lx.font = SERIF(s); lx.textBaseline='alphabetic'; lx.textAlign='left';
      lx.save(); lx.translate(68, 0); lx.scale(1, 1.22);
      lx.fillStyle = RED; lx.globalAlpha = flick;
      const lh = s*1.13, y0 = 290 + s*.95;
      lines.forEach((l,i)=> lx.fillText(l, 0, (y0 + i*lh)/1.22 + 0));
      lx.restore();
      roughen(lx, frame);
      ctx.drawImage(layer,0,0);
      // fog in front of everything low
      ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(glPass(1,0,t,p),0,0,W,H); ctx.restore();
      infoSlot(ctx, 68, 1405, 944, {});
      lightLeak(ctx, -60, 1250+80*Math.sin(t*6.283), 620, 'rgba(255,70,20,A)', .22+.12*pulse);
      lightLeak(ctx, W+40, 260, 520, 'rgba(255,40,30,A)', .12);
      vignette(ctx,.55);
      grain(ctx, frame, .22);
    }
  },
  b: {
    name:'B · STROBE — club minimal: black negative space, one tear of liquid chrome, tall stretched chrome type with strobe ghosting and a faint web in the corner.',
    draw(t, frame){
      const flash = Math.max(tri(t,.24,.012), .7*tri(t,.27,.01), .85*tri(t,.74,.012));
      const p = { moon:[0,0,0], moonA:0, glow:.42+.12*Math.sin(t*6.283), chrome:1+flash*.8 };
      ctx.drawImage(glPass(0,1,t,p),0,0,W,H);
      web(ctx, W-30, 270, 430, Math.PI*.52, Math.PI*.98, 7, 6, .13, 11);
      // stretched chrome headline
      lx.clearRect(0,0,W,H);
      const lines=['KIVEL','TALÁLKOZUNK?'];
      const s = fitSize(lx, SERIF, lines, 960, 200);
      const SY = 2.5, x = W/2;
      const yA = 600, yB = yA + s*SY*1.1;
      const drawLines = (g) => { g.save(); g.translate(x,0); g.scale(1,SY);
        g.fillText(lines[0], 0, yA/SY); g.fillText(lines[1], 0, yB/SY); g.restore(); };
      lx.font = SERIF(s); lx.textAlign='center'; lx.textBaseline='alphabetic';
      const chrome = (yb) => { const top = (yb - s*SY*.74)/SY, gr = lx.createLinearGradient(0,top,0,yb/SY); // scaled space
        [[0,'#ffffff'],[.2,'#b3afaf'],[.42,'#2a2424'],[.47,'#f4f2f2'],[.58,'#ffffff'],[.7,'#7a0b12'],[.8,'#181212'],[.92,'#a9a5a5'],[1,'#f0eeee']].forEach(([o,c])=>gr.addColorStop(o,c));
        return gr; };
      // strobe ghosts (horizontal smear) — stronger on flash frames
      const ghostA = .18 + flash*.35, off = 16 + flash*60;
      lx.fillStyle = 'rgba(200,10,20,1)'; lx.globalAlpha = ghostA;
      lx.save(); lx.translate(-off,0); drawLines(lx); lx.restore();
      lx.fillStyle = 'rgba(220,220,230,1)'; lx.globalAlpha = ghostA*.6;
      lx.save(); lx.translate(off*.6,0); drawLines(lx); lx.restore();
      lx.globalAlpha = 1;
      lx.save(); lx.translate(x,0); lx.scale(1,SY);
      lx.fillStyle = chrome(yA); lx.fillText(lines[0], 0, yA/SY);
      lx.fillStyle = chrome(yB); lx.fillText(lines[1], 0, yB/SY); lx.restore();
      roughen(lx, frame, .35);
      ctx.save(); ctx.shadowColor='rgba(170,0,12,.55)'; ctx.shadowBlur=40; ctx.drawImage(layer,0,0); ctx.restore();
      ctx.save(); ctx.globalAlpha=.75; ctx.drawImage(glPass(1,1,t,p),0,0,W,H); ctx.restore();
      infoSlot(ctx, 140, 1365, 800, { align:'center' });
      // strobe: whole-frame flash + horizontal streak
      if(flash>0){
        const fg = ctx.createRadialGradient(W/2,760,0,W/2,760,1150);
        fg.addColorStop(0,`rgba(255,248,245,${flash*.5})`); fg.addColorStop(1,`rgba(255,240,235,${flash*.08})`);
        ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); ctx.restore();
      }
      const sg = ctx.createLinearGradient(0,880,0,960);
      ctx.save(); ctx.globalCompositeOperation='screen';
      sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(.5,`rgba(255,240,235,${.10+flash*.5})`); sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sg; ctx.fillRect(0,880,W,80); ctx.restore();
      lightLeak(ctx, W+80, 1500, 700, 'rgba(255,60,20,A)', .16+.1*Math.sin(t*6.283+1));
      vignette(ctx,.7);
      grain(ctx, frame, .26);
    }
  },
  c: {
    name:'C · TELIHOLD — a full moon made of the liquid chrome, a bank of fog across it, a low ember glow, motion-blurred crimson type underneath. The most negative space.',
    draw(t, frame){
      const pulse = .5+.5*Math.sin(t*Math.PI*2);
      const p = { moon:[540,640,320], moonA:1, glow:.6+.4*pulse, chrome:1 };
      ctx.drawImage(glPass(0,2,t,p),0,0,W,H);
      web(ctx, -10, 250, 460, Math.PI*.02, Math.PI*.46, 7, 6, .09, 3);
      ctx.save(); ctx.globalAlpha=.95; ctx.drawImage(glPass(1,2,t,p),0,0,W,H); ctx.restore();
      // blurred + sharp crimson type
      lx.clearRect(0,0,W,H);
      const lines=['KIVEL','TALÁLKOZUNK?'];
      const s = fitSize(lx, SERIF, lines, 930, 160);
      lx.font = SERIF(s); lx.textAlign='center'; lx.textBaseline='alphabetic';
      const SY=1.35, y1=1135, y2=y1 + s*SY*.98;
      const put = (g)=>{ g.save(); g.translate(W/2,0); g.scale(1,SY); g.fillText(lines[0],0,y1/SY); g.fillText(lines[1],0,y2/SY); g.restore(); };
      lx.fillStyle = RED; put(lx);
      roughen(lx, frame);
      const b = 14 + 10*pulse;
      ctx.save(); ctx.filter=`blur(${b}px)`; ctx.globalAlpha=.9; ctx.globalCompositeOperation='screen'; ctx.drawImage(layer,0,0); ctx.restore();
      ctx.save(); ctx.filter='blur(3px)'; ctx.globalAlpha=.55; ctx.drawImage(layer,-12,0); ctx.drawImage(layer,12,0); ctx.restore();
      ctx.drawImage(layer,0,0);
      infoSlot(ctx, 190, 1365, 700, { align:'center' });
      lightLeak(ctx, 540, 1980, 900, 'rgba(255,90,30,A)', .18+.14*pulse);
      vignette(ctx,.6);
      grain(ctx, frame, .24);
    }
  }
};
// ink texture: darken/lighten speckles only where text exists
const tmp = mk(); const tx = tmp.getContext('2d');
function roughen(g, frame, amt=.55){
  tx.clearRect(0,0,W,H);
  const pat = tx.createPattern(grainTiles[(frame+1)%4],'repeat');
  tx.fillStyle = pat; tx.fillRect(0,0,W,H);
  tx.globalCompositeOperation='destination-in'; tx.drawImage(g.canvas,0,0); tx.globalCompositeOperation='source-over';
  g.save(); g.globalCompositeOperation='source-atop'; g.globalAlpha=amt*.45; g.globalCompositeOperation='overlay'; g.drawImage(tmp,0,0); g.restore();
}

/* ---------------- Loop / UI ---------------- */
const FPS = 30;
function render(t, frame){ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); VARIANTS[state.v].draw(t, frame); }
window.renderFrame = (v, frame, tOverride) => { state.v = v;
  if(tOverride != null){ render(tOverride === 'still' ? (VARIANTS[v].still ?? (frame % (LOOP*FPS)) / (LOOP*FPS)) : tOverride, frame); return cv.toDataURL('image/png'); }
  if(window.bgOnly){ ctx.drawImage(glPass(0,{a:0,b:1,c:2}[v],.12,{moon:[0,0,0],moonA:0,glow:0,chrome:1}),0,0,W,H); return cv.toDataURL('image/png'); } render((frame % (LOOP*FPS)) / (LOOP*FPS), frame); return cv.toDataURL('image/png'); };
window.setState = o => Object.assign(state, o);

let start = performance.now();
function tick(now){
  if(state.anim){ const sec = ((now-start)/1000) % LOOP; render(sec/LOOP, Math.floor((now-start)/1000*FPS)); }
  requestAnimationFrame(tick);
}
function staticRender(){ render(VARIANTS[state.v].still ?? 0.12, 0); }
const tabs = document.querySelectorAll('#tabs button');
function setV(v){ state.v=v; tabs.forEach(b=>b.classList.toggle('on', b.dataset.v===v)); document.getElementById('vname').textContent=VARIANTS[v].name; if(!state.anim) staticRender(); }
tabs.forEach(b=>b.onclick=()=>setV(b.dataset.v));
['date','loc'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{ state[id]=null; if(!state.anim) staticRender(); }));
document.getElementById('anim').onchange = e => { state.anim = e.target.checked; if(!state.anim) staticRender(); };
document.getElementById('safeT').onchange = e => document.getElementById('safe').classList.toggle('on', e.target.checked);
document.getElementById('guides').onchange = e => { state.guides = e.target.checked; if(!state.anim) staticRender(); };
document.getElementById('png').onclick = () => {
  const was = state.anim; state.anim=false; staticRender();
  cv.toBlob(b => { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`kivel-talalkozunk-${state.v}.png`; a.click(); state.anim=was; });
};
document.getElementById('rec').onclick = async (e) => {
  const btn = e.target; if(!window.MediaRecorder) return alert('MediaRecorder not supported');
  state.anim = true; document.getElementById('anim').checked = true; start = performance.now();
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType:'video/webm;codecs=vp9', videoBitsPerSecond:12e6 });
  const chunks=[]; rec.ondataavailable = d => chunks.push(d.data);
  rec.onstop = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})); a.download=`kivel-talalkozunk-${state.v}.webm`; a.click(); btn.textContent='6 mp WebM felvétele'; };
  btn.textContent='Felvétel…'; rec.start(); setTimeout(()=>rec.stop(), LOOP*1000);
};

document.getElementById('date').value = state.date ?? document.getElementById('date').value;
document.getElementById('loc').value = state.loc ?? document.getElementById('loc').value;
document.getElementById('anim').checked = state.anim;
const glyphs = 'KIVELTALÁKOZUNÍDÁTUMHELYSZÍN?-·0123456789.: ŐÖÜÓÉ';
Promise.all([
  document.fonts.load(SERIF(100), glyphs), document.fonts.load(SERIF7(30), glyphs),
  document.fonts.load(MONO(20,700), glyphs), document.fonts.load(MONO(20), glyphs),
]).catch(()=>{}).then(() => { setV(state.v); window.__ready = true; requestAnimationFrame(tick); });
})();
</script>
